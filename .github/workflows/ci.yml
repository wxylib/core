name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/fixtures
          # Pinned, so a fixtures change moves core's oracles only when
          # core says so. c3adea5: warp oracles from GDAL 3.12.4, which
          # wxy-resample matches; fixtures 897661a regenerated them with
          # GDAL 3.14.0dev (see the rwarp switch).
          ref: c3adea57de88b76964125d7abf37329417d124e2
          path: fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
