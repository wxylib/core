[package]
name = "wxy-warp"
description = "Warp wxylib sources to a target grid: GDAL's chunked warp with wxy-resample kernels, or one pass through rwarp."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["science::geo"]

[dependencies]
wxy-domain.workspace = true
wxy-source.workspace = true
# rwarp is external (design doc 03, A2). Pinned to the repository until a
# release carries the proj4rs backend and the generic kernel (crates.io
# 0.1.1 predates both).
wxy-resample.workspace = true
# exact cell coverage of polygons (exactextract's algorithm), sparse
controlledburn = "0.2.1"
proj4rs = { version = "0.1.10", default-features = false, features = ["crs-definitions"] }
rwarp = { git = "https://github.com/hypertidy/rwarp", rev = "20572c396307f71659508eda0411ee31e9d127c8", default-features = false, features = ["proj4rs"] }

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
serde_json = "1"
wxy-tiff = { path = "../wxy-tiff" }
