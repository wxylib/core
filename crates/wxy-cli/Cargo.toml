[package]
name = "wxy-cli"
description = "The wxy command: wxylib from the shell."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["science::geo", "command-line-utilities"]

[[bin]]
name = "wxy"
path = "src/main.rs"

[dependencies]
wxy-domain.workspace = true
wxy-source.workspace = true
wxy-tiff = { path = "../wxy-tiff" }
wxy-zarr = { path = "../wxy-zarr" }
wxy-warp = { path = "../wxy-warp" }
wxy-cache = { path = "../wxy-cache" }
wxy-refs = { path = "../wxy-refs" }
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
# float_roundtrip: GeoJSON coordinates parsed to the nearest double
serde_json = { version = "1", features = ["float_roundtrip"] }

[dev-dependencies]
serde_json = "1"
wxy-virtual = { path = "../wxy-virtual" }
