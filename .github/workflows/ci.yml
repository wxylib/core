name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/fixtures
          # Pinned, so a fixtures change moves core's oracles only when
          # core says so. e203c85: warp, curvilinear, cf and index oracles
          # from GDAL 3.14.0dev-739fcf03bf (wxylib/fixtures#11, #12);
          # 6455dd5 adds mdimrefs/bluelink-synthetic (wxylib/fixtures#16).
          ref: 6455dd52fc7273b737648bdf4022dfb454dd495f
          path: fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
