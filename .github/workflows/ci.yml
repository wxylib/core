name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/fixtures
          # Pinned, so a fixtures change moves core's oracles only when
          # core says so. 2fff59c: warp, curvilinear, cf and index oracles
          # from GDAL 3.14.0dev-739fcf03bf (wxylib/fixtures#11).
          ref: 2fff59c86899ae7ad2bead98d86f9b0ecfca5d27
          path: fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
