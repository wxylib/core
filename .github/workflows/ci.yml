name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/fixtures
          # Pinned, so a fixtures change moves core's oracles only when
          # core says so. 2f7c7d0: warp, curvilinear, cf and index oracles
          # from GDAL 3.14.0dev-739fcf03bf (wxylib/fixtures#11, #12), the vrt/
          # corpus (#13, vrt-model's oracle) and cog/ as an oracle-case set (#14).
          ref: 2f7c7d0dbdfdaaa11ac707f662fbddf48dab5a57
          path: fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
