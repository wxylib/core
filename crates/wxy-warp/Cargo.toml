[package]
name = "wxy-warp"
description = "Warp wxylib sources to a target grid: GDAL's chunked warp with rwarp's kernels, or one pass through rwarp."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
categories = ["science::geo"]

[dependencies]
wxy-domain.workspace = true
wxy-source.workspace = true
# exact cell coverage of polygons (exactextract's algorithm), sparse
controlledburn = "0.3.1"
# plans and options as values (EXPLAIN, dry runs, bindings)
serde.workspace = true
# the same proj4rs rwarp uses: two copies in one wasm build both export
# proj4rs's wasm-bindgen `Point`, which wasm-bindgen refuses
proj4rs = { version = "0.3.0", default-features = false, features = ["crs-definitions"] }
# rwarp is external (design doc 03, A2): the kernels the chunked warp runs
rwarp = { version = "0.3", default-features = false, features = ["proj4rs"] }
# trial CRS engine (src/crs.rs): WKT, PROJJSON, ESRI and datum steps
# without PROJ; off by default, proj4rs stays the engine for wasm builds
terrio-crs = { version = "0.2.2", default-features = false, optional = true }

[features]
default = []
# build warp, points and zonal on terrio-crs instead of proj4rs
terrio-crs = ["dep:terrio-crs"]
# terrio-crs's fallback to wbprojection for projections it lacks
terrio-crs-fallback = ["terrio-crs", "terrio-crs/wbprojection-fallback"]

[dev-dependencies]
async-trait.workspace = true
tokio.workspace = true
serde_json = "1"
wxy-tiff = { path = "../wxy-tiff" }
