[package]
name = "wxy-virtual"
description = "Virtual Zarr for wxylib: scanners that turn files into chunk references, stored with Icechunk and read through zarrs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.95"
categories = ["science::geo"]

[dependencies]
wxy-domain.workspace = true
wxy-source.workspace = true
wxy-geozarr.workspace = true
wxy-tiff = { path = "../wxy-tiff", version = "0.0.1" }
wxy-zarr = { path = "../wxy-zarr", version = "0.0.1" }
async-tiff.workspace = true
icechunk = { version = "~2.3.0", default-features = false, features = ["object-store-fs"] }
zarrs_icechunk = "0.6.0"
serde_json = "1"
zarrs = { version = "0.23.14", default-features = false, features = ["async"] }
tokio = { version = "1.43", features = ["sync"] }
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "zstd", "snap"] }
arrow-array = { version = "60.0.0", default-features = false }
arrow-schema = { version = "60.0.0", default-features = false }
arrow-cast = { version = "60.0.0", default-features = false }

[dev-dependencies]
tokio.workspace = true
