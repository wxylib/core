name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/fixtures
          # Pinned, so a fixtures change moves core's oracles only when
          # core says so. e203c85: warp, curvilinear, cf and index oracles
          # from GDAL 3.14.0dev-739fcf03bf (wxylib/fixtures#11, #12).
          # fd6bb9f adds the vrt/ corpus (vrt-model's oracle).
          ref: fd6bb9f056da202662d8e1e14c478f42147ef557
          path: fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
      # CRS engine trial: the warp, points and zonal suites again on
      # terrio-crs in place of proj4rs (wxy-warp's crs module).
      - run: cargo test -p wxy-warp -p wxy-cli --features wxy-warp/terrio-crs
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
