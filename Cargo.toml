[workspace]
resolver = "2"
members = ["crates/wxy-domain", "crates/wxy-source", "crates/wxy-tiff", "crates/wxy-geozarr", "crates/wxy-zarr", "crates/wxy-virtual", "crates/wxy-resample", "crates/wxy-warp", "crates/wxy-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wxylib/core"
authors = ["Michael Sumner <mdsumner@gmail.com>"]

[workspace.dependencies]
vaster = "0.2.0"
wxy-domain = { path = "crates/wxy-domain", version = "0.0.1" }
wxy-source = { path = "crates/wxy-source", version = "0.0.1" }
wxy-resample = { path = "crates/wxy-resample", version = "0.0.1" }
wxy-geozarr = { path = "crates/wxy-geozarr", version = "0.0.1" }
async-trait = "0.1.89"
bytes = "1.12.0"
futures = "0.3.31"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
async-tiff = { version = "0.4.0", default-features = false, features = ["object_store"] }
object_store = "0.14"
tokio = { version = "1.43", features = ["macros", "rt-multi-thread"] }

