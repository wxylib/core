[package]
name = "wxy-predictor"
description = "TIFF predictor codecs for zarrs: horizontal differencing (TIFF Predictor=2) as a Zarr array-to-array codec, so tiles of predicted TIFFs read as virtual Zarr chunks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
inventory = "0.3"
zarrs_codec = { version = "0.2.1", features = ["async"] }
zarrs_data_type = "0.9.0"
zarrs_metadata = "0.7.5"
zarrs_plugin = "0.4.1"

[dev-dependencies]
zarrs = { version = "0.23.14", default-features = false, features = ["zstd"] }
serde_json = "1"
