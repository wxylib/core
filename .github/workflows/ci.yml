name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: wxylib/fixtures
          # Pinned, so a fixtures change moves core's oracles only when
          # core says so. ce5e779: warp, curvilinear, cf and index oracles
          # from GDAL 3.14.0dev-739fcf03bf (wxylib/fixtures#11, #12), the vrt/
          # corpus (#13, vrt-model's oracle), cog/ as an oracle-case set (#14),
          # warpgrid answers (#17), mdimrefs/bluelink-synthetic (#16), the
          # rasterwise set (#18), BRAN oracle hashes (#19) and the producer
          # row check (#20).
          ref: ce5e7795b4815494cdcb538cb45402602ccca57e
          path: fixtures
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures
      # CRS engine trial: the warp, points and zonal suites again on
      # terrio-crs in place of proj4rs (wxy-warp's crs module).
      - run: cargo test -p wxy-warp -p wxy-cli --features wxy-warp/terrio-crs
        env:
          WXY_FIXTURES: ${{ github.workspace }}/fixtures

  # The crates the browser build (wxylib/web) is made of still build for
  # wasm32: the readers and the warp, with zarrs and its C codecs.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p wxy-tiff -p wxy-zarr -p wxy-warp --target wasm32-unknown-unknown
